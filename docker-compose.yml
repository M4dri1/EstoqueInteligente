services:
  postgres:
    image: postgres:16-alpine
    container_name: kassius-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kassius
      POSTGRES_PASSWORD: kassius_dev_password
      POSTGRES_DB: estoquekassius
    ports:
      - "5434:5432"
    volumes:
      - kassius_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kassius -d estoquekassius"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kassius-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - kassius_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kassius_postgres_data:
  kassius_redis_data:
